services:
  umbra:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      UMBRA_NETWORK: ${UMBRA_NETWORK:-testnet}
      UMBRA_RPC_URLS: ${UMBRA_RPC_URLS:-https://soroban-testnet.stellar.org,https://soroban-rpc.testnet.stellar.gateway.fm}
      DATABASE_URL: postgres://umbra:umbra@postgres:5432/umbra?sslmode=disable
      UMBRA_DEPLOYMENTS: /deployments/${UMBRA_NETWORK:-testnet}.json
      UMBRA_GET_LEDGERS_LIMIT: ${UMBRA_GET_LEDGERS_LIMIT:-100}
      UMBRA_HANDOFF_CUTOFF_LEDGERS: ${UMBRA_HANDOFF_CUTOFF_LEDGERS:-86400}
      UMBRA_LOG_CLIENT_IP: ${UMBRA_LOG_CLIENT_IP:-false}
    ports:
      - "8080:8080"
    # Docker's embedded resolver intermittently failed to resolve the
    # fallback RPC host ("no such host"), silently reducing the pool to
    # one endpoint. Pin reliable upstreams.
    dns:
      - 1.1.1.1
      - 8.8.8.8

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: umbra
      POSTGRES_PASSWORD: umbra
      POSTGRES_DB: umbra
    volumes:
      - umbra-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umbra"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  umbra-pgdata:
